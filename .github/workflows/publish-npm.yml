name: Publish SDK (npm)

# All @wavehouse/sdk npm publishing lives in this ONE file: npm allows only ONE
# trusted publisher (workflow file) per package, so the dev channel and tagged
# releases can't be split across two files. Two jobs:
#
#   dev      push to main → 0.0.1-dev.<utc-stamp>.h<build-hash> under the `dev`
#            dist-tag, published only when the PUBLISHED PACKAGE changes: the
#            hash covers everything `npm pack` would ship, not just dist, so a
#            manifest-only change still republishes.
#
#   release  v* tag → the tag's version under `latest` (stable) or
#            `alpha`/`beta`/`rc`/`next` (prerelease), plus a GitHub Release.
#
# BOTH jobs are gated on the repository variable NPM_PUBLISH_ENABLED being
# 'true'. Until the cutover, npm's one trusted publisher for this package is
# still the WaveHouse repository's publish-npm.yml, so a publish from here
# would fail (and must not race that workflow). Cutover:
#   1. On npmjs.com, re-point the @wavehouse/sdk trusted publisher to this
#      repository's publish-npm.yml.
#   2. Set the repository variable NPM_PUBLISH_ENABLED to 'true' here.
#   3. Remove SDK publishing from the WaveHouse repository.
#
# The TAG is the version. The release job writes the tag's version into
# package.json before publishing rather than checking that someone remembered
# to bump it: the branch ruleset forbids direct commits to `main`, so a bump
# would need its own PR before every release. Releasing is tagging a commit on
# main as vX.Y.Z and sending the tag to origin, nothing else.
#
# Dev version scheme (#475) — two properties, in this order:
#
#   ORDERED BY RECENCY. Dev versions used to be `0.0.0-dev.h<hash>`. semver
#   compares alphanumeric prerelease identifiers LEXICALLY, so a content hash
#   makes the order arbitrary with respect to time: of the ten publishes on
#   that scheme, the newest sorted sixth and a June build was the highest.
#   That matters because `npm i @wavehouse/sdk@dev` records a RANGE, not the
#   tag — `^0.0.0-dev.h04a…` is satisfied by `0.0.0-dev.hff4…`, so the next
#   resolution walked backwards two months and the lockfile pinned it there.
#   The `<utc-stamp>` identifier is numeric, and semver compares numeric
#   identifiers numerically, so the channel now orders by publish time.
#
#   ISOLATED FROM RELEASES. The base is `0.0.1`, not `0.0.0` and not the
#   upcoming release version. `0.0.1-*` outranks every legacy `0.0.0-dev.*`
#   (which are permanent — npm's unpublish window is 72 hours), so the poisoned
#   history can never win a range again. And because prereleases only satisfy
#   ranges anchored to their own MAJOR.MINOR.PATCH, a dev build can never leak
#   into `^0.1.0` — nor can a release ever shadow the dev channel. 0.0.1 is
#   permanently free: this package's first release was 0.1.0.
#
# The trailing `.h<hash>` keeps the PACKAGE content-addressed: it is what the
# dev job compares against to decide whether there is anything new to publish.
#
# Auth: OIDC trusted publishing, no NPM_TOKEN. Both publish steps pass
# --provenance for a signed build-provenance attestation (the OIDC id-token
# below + public repo + npm >= 11.5.1 from Node 24).

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # OIDC for npm trusted publishing

concurrency:
  # main (dev) tracks HEAD → cancel superseded builds; tags (release) get
  # their own group and never cancel mid-publish.
  group: publish-npm-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

jobs:
  dev:
    name: Dev snapshot (@dev)
    if: vars.NPM_PUBLISH_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Only contents: read here, so this is hygiene rather than exposure —
          # but npm lifecycle scripts run in this job too, and nothing needs
          # authenticated git.
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: "11.21.0"
          run_install: false

      # Node 24 ships npm >= 11.5.1 for OIDC trusted publishing, and dodges the
      # broken in-place npm self-upgrade on the Node 22.22.2 runner image
      # (actions/runner-images#13883). The SDK build is Node-version-agnostic.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck and build the SDK
        run: |
          pnpm run typecheck
          pnpm run build

      - name: Publish @wavehouse/sdk@dev when the build changes
        shell: bash
        env:
          # The dev channel's own version line, deliberately BELOW any version
          # this package will ever release (it shipped 0.1.0 first), and ABOVE
          # every legacy `0.0.0-dev.*` publish. See the version-scheme note in
          # the header comment.
          DEV_BASE: "0.0.1"
        run: |
          set -euo pipefail

          # Content hash of what npm would actually PUBLISH, not just of dist.
          # `dist` alone misses everything else in the tarball: a change to
          # `exports`, `files`, `bin`, `engines`, or the bundled README/LICENSE
          # leaves dist byte-identical, so the skip check below would suppress a
          # publish that genuinely changed the package. `npm pack --dry-run`
          # asks npm itself for the file list rather than reimplementing its
          # `files`/.npmignore rules. The `version` field is stripped before
          # hashing because we are about to compute it from this very hash.
          # npm still runs `prepare` here despite --ignore-scripts, and its output
          # lands on stdout ahead of the JSON, so slice from the array start.
          files=$(npm pack --dry-run --json --ignore-scripts 2>/dev/null \
            | sed -n '/^\[$/,$p' \
            | node -e '
                const p = JSON.parse(require("fs").readFileSync(0, "utf8"));
                for (const f of p[0].files) console.log(f.path);
              ' | LC_ALL=C sort)
          [ -n "$files" ] || { echo "::error::npm pack returned no file list"; exit 1; }

          # Hash the file list plus every file's contents. package.json is
          # hashed with `version` removed — we are about to derive the version
          # from this hash, so including it would be circular. NOTE: no replacer
          # array on JSON.stringify; it filters keys RECURSIVELY, which would
          # flatten nested objects (`exports`, `engines`, `publishConfig`) to
          # `{}` and silently miss changes to them.
          hash=$( { printf '%s\n' "$files"
                    printf '%s\n' "$files" | while IFS= read -r f; do
                      if [ "$f" = "package.json" ]; then
                        node -e 'const p=require("./package.json"); delete p.version; process.stdout.write(JSON.stringify(p))'
                      else
                        cat -- "$f"
                      fi
                    done
                  } | sha256sum | cut -c1-12)

          # Skip only when `dev` ALREADY points at a same-scheme publish of this
          # exact package. Matching on the hash alone would let a legacy
          # `0.0.0-dev.h<hash>` publish satisfy the check and strand the tag on
          # the old, unordered version line forever (a docs-only push to main
          # rebuilds a byte-identical package).
          current=$(npm view "@wavehouse/sdk@dev" version 2>/dev/null || true)
          case "${current}" in
            "${DEV_BASE}-dev."*".h${hash}")
              echo "Build unchanged — @wavehouse/sdk@dev is already ${current}; nothing to do."
              exit 0
              ;;
          esac

          # Publish-time UTC stamp as the FIRST prerelease identifier after
          # `dev`. semver compares prerelease identifiers left to right and
          # compares numeric ones numerically, so this — not the hash — is what
          # orders the channel by recency (#475). The hash stays on the end for
          # identity; `h`-prefixed so an all-digit hash can't become a numeric
          # identifier with a leading zero.
          stamp=$(date -u +%Y%m%d%H%M%S)
          version="${DEV_BASE}-dev.${stamp}.h${hash}"

          echo "Publishing ${version} (previous dev: ${current:-<none>})"
          npm version "${version}" --no-git-tag-version --allow-same-version
          # --ignore-scripts publishes exactly the dist we just hashed (the
          # typecheck + build already ran above; this skips a redundant rebuild).
          # --provenance attaches a signed build-provenance attestation.
          npm publish --access public --tag dev --ignore-scripts --provenance

  release:
    name: Release (v* tag)
    if: vars.NPM_PUBLISH_ENABLED == 'true' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the GitHub Release
      id-token: write # OIDC for npm trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The GitHub Release step resolves which tag the generated notes start
          # from with `git describe … "<tag>^"`, which needs commit HISTORY, not
          # just the tag list — under the default depth-1 checkout `<tag>^` does
          # not resolve at all. fetch-depth: 0 brings both history and tags.
          fetch-depth: 0
          # This job holds `contents: write`, and `pnpm install` plus npm
          # lifecycle scripts run before the release step — so a compromised
          # dependency would inherit push access from credentials left in
          # .git/config. Nothing here needs authenticated git: `git describe`
          # is local and `gh release create` uses GH_TOKEN.
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: "11.21.0"
          run_install: false

      # Node 24 ships npm >= 11.5.1 for OIDC trusted publishing — see the dev job.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve version + dist-tag
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          ref="${GITHUB_REF#refs/tags/}"

          # The tag is the version, minus its leading `v`; release-channel.sh
          # rejects anything that isn't semver-shaped when it resolves the
          # dist-tag below.
          version="${ref#v}"

          # package.json's committed value is documentation, not the source of
          # truth — a bump commit would need its own PR, since the ruleset
          # forbids pushing to `main`. Surface the drift, don't fail on it.
          declared=$(node -p "require('./package.json').version")
          if [ "${declared}" != "${version}" ]; then
            echo "::notice::package.json says ${declared}; publishing ${version} from the tag."
          fi

          # Shared with the other SDK repos, so a channel means the same thing
          # everywhere. Stable → latest; prerelease → alpha/beta/rc/next.
          tag="$(scripts/ci/release-channel.sh "${ref}")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "dist_tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${version} under dist-tag '${tag}'."

      - name: Publish to npm
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          DIST_TAG: ${{ steps.meta.outputs.dist_tag }}
        shell: bash
        run: |
          set -euo pipefail
          # Stamp the tag's version in. package.json is not the source of truth
          # (see "Resolve version" above) so this is what actually decides the
          # published version. --allow-same-version keeps a re-run idempotent
          # when the committed value already matches.
          npm version "${VERSION}" --no-git-tag-version --allow-same-version

          # --allow-same-version covers `npm version`, NOT `npm publish`: npm
          # rejects an already-published version outright. Without this guard a
          # re-run after a post-publish failure (the GitHub Release step, a
          # network blip) dies here and can never reach the steps that still
          # need to run. Idempotent instead.
          if npm view "@wavehouse/sdk@${VERSION}" version >/dev/null 2>&1; then
            echo "::notice::@wavehouse/sdk@${VERSION} is already published — skipping publish."
            exit 0
          fi
          # `npm publish` typechecks + builds via the package's prepublishOnly.
          # --provenance attaches a signed build-provenance attestation.
          npm publish --access public --tag "${DIST_TAG}" --provenance

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.meta.outputs.version }}
          DIST_TAG: ${{ steps.meta.outputs.dist_tag }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"

          # Publishing to npm already happened. Never fail this job over the
          # GitHub Release: if one already exists for this tag — because it was
          # drafted in the Releases UI, or because the job is being re-run after
          # a transient failure — `gh release create` would exit non-zero and
          # red an otherwise successful publish. Leave the existing one alone,
          # so hand-written notes are never clobbered.
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::notice::Release $tag already exists — leaving its notes untouched."
            exit 0
          fi

          flags=(--title "@wavehouse/sdk ${VERSION}")
          if [ "${DIST_TAG}" != "latest" ]; then
            flags+=(--prerelease)
          fi

          # Anchor the generated notes to the previous release tag, found by
          # walking history from this tag's parent rather than by version-sorting
          # the tag list: sorting can pick a tag that is ahead of this one (a
          # patch released while a newer minor exists), and git ranks a
          # prerelease above its own release.
          prev="$(git describe --tags --abbrev=0 --match 'v*' "${tag}^" 2>/dev/null || true)"
          if [ -n "$prev" ]; then
            flags+=(--generate-notes --notes-start-tag "$prev")
            echo "Generating notes covering ${prev}..${tag}"
          else
            # No earlier tag to diff from, and letting GitHub guess could yield
            # an empty changelog; an explicit body beats an empty one.
            flags+=(--notes "First release of \`@wavehouse/sdk\` from this repository. See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md) for the change list.")
            echo "No earlier v* tag — using the first-release note."
          fi

          gh release create "$tag" "${flags[@]}"
